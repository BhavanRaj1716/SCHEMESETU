# Local development: FastAPI + PostgreSQL with pgvector.
#   docker compose up --build
# Dev-only credentials below; never reuse them outside your machine.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: schemesetu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schemesetu_dev}
      POSTGRES_DB: schemesetu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schemesetu -d schemesetu"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      args:
        INSTALL_ML: ${INSTALL_ML:-true}
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://schemesetu:${POSTGRES_PASSWORD:-schemesetu_dev}@db:5432/schemesetu
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-sentence-transformers}
      SEMANTIC_MIN_SIMILARITY: ${SEMANTIC_MIN_SIMILARITY:-0.15}
      AUTH_MODE: ${AUTH_MODE:-none}
      SEED_ON_START: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
