services:
  - type: web
    name: schemesetu-backend
    runtime: python
    rootDir: schemesetu-backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m seed.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: schemesetu-db
          property: connectionString
      - key: SEED_ON_START
        value: "true"
      - key: EMBEDDING_PROVIDER
        value: "hashing"
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: schemesetu-db
    databaseName: schemesetu
    user: schemesetu_user
    plan: free
